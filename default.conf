server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        try_files /favicon.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
